<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live API Trivia</title>
  <link rel="stylesheet" href="style.css">
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <div class="container">
    <h1>🌍 Live API Trivia</h1>

    <div id="menu-screen">
      <input type="text" id="username" placeholder="Majd">
      <button onclick="createLobby()">Create Host Lobby</button>
      <hr>
      <input type="text" id="room-code-input" placeholder="4-Digit Code">
      <button onclick="joinLobby()">Join Game</button>
    </div>

    <div id="lobby-screen" class="hidden">
      <h2>Lobby Code: <span id="lobby-code-display"></span></h2>
      <h3>Players in Room:</h3>
      <ul id="player-list"></ul>
      <div id="host-controls" class="hidden">
        <h3>Choose a Topic:</h3>
        <p><small>Math, Science, History, Gaming, Aviation, Tech...</small></p>
        <input type="text" id="mainTopic" placeholder="e.g. aviation">
        <br>
        <button onclick="startGame()">Generate Questions & Start!</button>
      </div>
    </div>

    <div id="game-screen" class="hidden">
      <div id="question-header">
        <span id="question-tracker">Question 1/10</span>
        <div id="timer-box">⏱️ <span id="timer-display">15</span>s</div>
      </div>
      <h2 id="question-text">Loading question...</h2>
      <div id="options-grid"></div>
    </div>

    <div id="results-screen" class="hidden">
      <h2>⏰ Time's Up!</h2>
      <p id="correct-answer-reveal"></p>
      <h3>🏆 Round Leaderboard</h3>
      <ul id="leaderboard"></ul>
      <div id="host-next-btn" class="hidden">
        <button onclick="nextQuestion()">Next Question ➔</button>
      </div>
    </div>
  </div>
  <script src="client.js"></script>
</body>
</html>
